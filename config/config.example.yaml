# Wallet Service 配置示例
# 复制此文件为 config.yaml 并根据需要修改

# 应用配置
app:
  env: development              # 运行环境: development/production
  http_port: 8080               # HTTP/Gateway 端口
  grpc_port: 9090               # gRPC 端口
  machine_id: 1                 # 机器码 (0-63)，用于生成唯一ID

# PostgreSQL 数据库配置
postgres:
  host: localhost               # 数据库主机
  port: 5432                    # 数据库端口
  user: wallet                  # 数据库用户名
  password: wallet123           # 数据库密码
  database: wallet              # 数据库名
  max_conns: 100                # 最大连接数
  min_conns: 10                 # 最小连接数
  max_conn_life: 1h             # 连接最大生命周期
  max_conn_idle: 30m            # 连接最大空闲时间

# 会话配置
session:
  ttl: 24h                      # 会话有效期

version: v1
managed:
  enabled: true
plugins:
  - plugin: go
    out: ../../../api/grpc/v1
    opt:
      - paths=source_relative
  - plugin: go-grpc
    out: ../../../api/grpc/v1
    opt:
      - paths=source_relative
  - plugin: grpc-gateway
    out: ../../../api/grpc/v1
    opt:
      - paths=source_relative
  - plugin: openapiv2
    out: ../../../internal/server/swagger-ui
    opt:
      - allow_merge=true
      - merge_file_name=wallet
